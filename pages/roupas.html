<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja da Regi</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

    <!-- Checkbox que controla o menu lateral (sem JavaScript) -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle">

    <header>
        <div class="topbar">

            <!-- ESQUERDA: menu hambúrguer -->
            <div class="hamburguer">
                <label for="menu-toggle" class="hamburguer-btn" aria-label="Abrir menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
            </div>

            <!-- MEIO: busca -->
            <div class="search">
                <form action="#" method="get">
                    <input type="search" name="q" placeholder="O que você procura?">
                    <button type="submit">Buscar</button>
                </form>
            </div>

            <!-- DIREITA: logo -->
            <div class="logo">
                <h1 class="title">
                    <a href="/index.html">Loja da Regi <img src="/img/icon-base.webp" alt="Logo" class="icon"></a>
                </h1>
                <h3 class="sub-title">a melhor de todas</h3>
            </div>
        </div>

        <!-- NAV: categorias + conta + carrinho -->
        <nav>
            <div class="category">
                <a href="roupas.html" class="clothes">Roupas</a>
                <a href="eletronicos.html" class="electronic">Eletrônicos</a>
                <a href="outros.html" class="itens">Outros</a>
            </div>

            <div class="account">
                <a href="#" class="register">Crie a sua conta</a>
                <a href="#" class="entrar">Entre</a>
                <a href="#" class="cart">🛒 Carrinho <span class="cart-count">0</span></a>
            </div>
        </nav>
    </header>

    <!-- Menu lateral (abre pelo hambúrguer) -->
    <aside class="side-menu">
        <label for="menu-toggle" class="close-btn">✕</label>
        <h2>Menu</h2>
        <a href="/index.html">Início</a>
        <a href="roupas.html" class="clothes">Roupas</a>
        <a href="eletronicos.html" class="electronic">Eletrônicos</a>
        <a href="outros.html" class="itens">Outros</a>
        <a href="#">Minha conta</a>
        <a href="#">Meus pedidos</a>    
    </aside>
    <label for="menu-toggle" class="overlay"></label>

    <main>
        <h2 class="section-title">Destaques</h2>
        <div class="products">
            <article class="product">
                <div class="product-img">Foto</div>
                <h3>Camiseta</h3>
                <p class="price">R$ 49,90</p>
                <button>Comprar</button>
            </article>
             <article class="product">
                <div class="product-img">Foto</div>
                <h3>Calça jeans</h3>
                <p class="price">R$ 119,90</p>
                <button>Comprar</button>
            </article>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Loja da Regi - a melhor de todas</p>
    </footer>

</body>
</html>
